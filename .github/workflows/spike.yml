name: spike

on: workflow_dispatch

jobs:
  probe:
    runs-on: [self-hosted, actions-sandbox]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Allowed
        run: |
          set -x
          whoami
          pwd
          echo ok > "$RUNNER_TEMP/write-probe" && cat "$RUNNER_TEMP/write-probe"
          curl -sS -m 10 -o /dev/null -w '%{http_code}\n' https://api.github.com
      - name: Denied
        run: |
          set -x
          ls /Users || echo "read host home: denied"
          ls /Volumes || echo "read host volumes: denied"
